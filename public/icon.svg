<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Box Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Orbit Rings -->
  <g stroke="#ffffff" stroke-width="12" fill="none" opacity="0.85" transform="translate(256, 256)">
    <ellipse rx="160" ry="60" transform="rotate(0)"/>
    <ellipse rx="160" ry="60" transform="rotate(60)"/>
    <ellipse rx="160" ry="60" transform="rotate(120)"/>
  </g>
  
  <!-- Center Nucleus Glow -->
  <circle cx="256" cy="256" r="44" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="28" fill="#3b82f6"/>
  
  <!-- Electrons -->
  <circle cx="416" cy="256" r="16" fill="#60a5fa"/>
  <circle cx="176" cy="117" r="16" fill="#38bdf8"/>
  <circle cx="176" cy="395" r="16" fill="#818cf8"/>
</svg>
